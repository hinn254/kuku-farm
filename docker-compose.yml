services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuku
      POSTGRES_PASSWORD: kuku
      POSTGRES_DB: kuku_farm
    ports:
      - "5432:5432"
    volumes:
      - kuku_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuku -d kuku_farm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kuku_pg_data:
